[flake8]
# https://flake8.pycqa.org/en/latest/user/configuration.html
# ignore = D203

max-complexity = 50
# Set the maximum line length
max-line-length = 180
indent-size = 4


exclude = .git, __pycache__, .venv, venv, env, migrations, .tox, .nox

# Ignore specific error codes (example: E501 for line length, W503 for line breaks)
# E101 - indentation contains mixed spaces and tab
# E125 - continuation line with same indent as next logical line
# E126 - continuation line over-indented for hanging indent
# E128 - continuation line under-indented for visual indent
# E741 - Ambiguous Variable
# E999 - f-string: unmatched
# W191 - Ignore indentation with tabs warning
# W503 - line break before binary operator
ignore = W191, E741, E101, E128, E126, W503, E125, E999

per-file-ignores =
	*/urls*.py: E241, E501

# Specify which Python version to target
# select = C,E,F,W,B
