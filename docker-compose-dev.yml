services:
  frontend:
    container_name: walpaca_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
      - "${NETWORK_ADDRESS}:${FRONTEND_PORT}:3000"
      - "${VPN_ADDRESS}:${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      CORS_DOMAINS: "${CORS_DOMAINS}"
      PRODUCTION: 0
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"
    restart: always
    command: sh run_server.sh

  backend:
    container_name: walpaca_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT}:5000"
      - "${NETWORK_ADDRESS}:${BACKEND_PORT}:5000"
      - "${VPN_ADDRESS}:${BACKEND_PORT}:5000"
    volumes:
      - ./backend:/app
      - ./alpaca.db:/app/alpaca.db
      - ./personas:/app/personas
      - ./lorebook:/app/lorebook
      - ./prompts:/app/prompts
      - ./config:/app/config
      - ./storage:/app/storage
    environment:
      ALPACA_DB_PATH: "/app/alpaca.db"
      TTS_SERVER_URL: "http://kokoro:8880"
      TTS_API_KEY: ${KOKORO_API_KEY}
      WHISPER_SERVER_URL: "http://whisper:9000"
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      CORS_DOMAINS: "${CORS_DOMAINS}"
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"
    restart: always

  kokoro:
    container_name: walpaca_kokoro
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest # or -gpu
    volumes:
      - kokoro-data:/var/lib/kokoro
      - kokoro_cache:/root/.cache/huggingface
    environment:
      KOKORO_API_KEY: ${KOKORO_API_KEY}
      HF_HUB_OFFLINE: 0 # 0 = Allows downloads, 1 = Offline mode
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"
    restart: always

  whisper:
    container_name: walpaca_whisper
    image: hwdsl2/whisper-server:latest # Use `hwdsl2/whisper-server:cuda` if you have an NVIDIA GPU
    volumes:
      - whisper-data:/var/lib/whisper
    environment:
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      WHISPER_MODEL: base # Options: tiny, base, small, medium, large-v3, large-v3-turbo
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"
    # Uncomment the block below if you are using an NVIDIA GPU and have the NVIDIA Container Toolkit installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  kokoro-data:
  kokoro_cache:
  whisper-data:
