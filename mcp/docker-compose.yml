services:
    fetch:
        container_name: walpaca_mcp_fetch
        build: ./fetch
        ports:
            - "8081:8080"
        restart: always

    web-search:
        container_name: walpaca_mcp_web_search
        build: ./web-search
        ports:
            - "8082:8080"
        restart: always

    youtube:
        container_name: walpaca_mcp_youtube
        build: ./youtube
        ports:
            - "8083:8080"
        restart: always

    website:
        container_name: walpaca_mcp_website
        build: ./website
        ports:
            - "8084:8080"
        restart: always
